<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام الإنتاج الموحد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <div class="header-top">
            <div class="dept-title">
                <i class="fa-solid fa-layer-group"></i> 
                <span>التجميع النهائي</span>
                <!-- مؤشر الاتصال بالسيرفر -->
                <span id="connection-status" class="status-dot offline" title="جاري الاتصال..."></span>
            </div>
        </div>
        <div class="global-filters">
            <input type="date" id="global-date">
            <select id="global-shift">
                <option value="1">وردية أولى (1)</option>
                <option value="2">وردية ثانية (2)</option>
                <option value="3">وردية ثالثة (3)</option>
            </select>
        </div>
    </header>

    <main class="content-area">
        <section id="screen-production" class="screen active">
            <div class="card summary-card">
                <h2>إجمالي الإنتاج (مباشر)</h2>
                <div class="total-number" id="live-total">0</div>
            </div>

            <div class="card">
                <h3 class="card-title">سجل الساعات</h3>
                <div id="production-list">
                    <!-- سيتم التوليد بواسطة JS -->
                </div>
            </div>
        </section>
    </main>

    <div id="toast">رسالة تنبيه</div>

    <script type="module" src="app.js"></script>
</body>
</html>
